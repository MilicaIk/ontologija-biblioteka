name: Нацртај онтологију

on:
  push:
    paths: ['podaci/**', 'crtaj.py', '.github/workflows/crtaj.yml']
  workflow_dispatch:

jobs:
  crtaj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Системске библиотеке за cairosvg
        run: sudo apt-get update && sudo apt-get install -y libcairo2 fonts-dejavu
      - run: pip install -r zahtevi.txt
      - run: python crtaj.py
      - uses: actions/upload-artifact@v4
        with:
          name: ontologija
          path: izlaz/
